[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-books-engine"
version = "0.1.0"
description = "Reusable coloring-book and voiceover-book engines for Legacy Works Publishing"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.0", "reportlab>=4.4"]

[project.scripts]
legacy-books = "legacy_books.cli:main"

[tool.setuptools.packages.find]
include = ["legacy_books*"]

[project.optional-dependencies]
test = ["pytest>=9", "pypdf>=5"]
